name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run pytest
        env:
          APP_ENV: development
          APP_DEBUG: '0'
          MARKET_DATA_PROVIDER: mootdx
          MARKET_DATA_FALLBACKS: akshare
        run: python -m pytest

  frontend-build:
    name: Frontend build and E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: /api/v1
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          APP_ENV: development
          APP_DEBUG: '0'
          MARKET_DATA_PROVIDER: mootdx
          MARKET_DATA_FALLBACKS: akshare
          SECRET_KEY: e2e-dev-secret-key-please-do-not-use-in-prod
        run: npm run test:e2e:ci

  deployment-config:
    name: Compose config and image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI environment file
        run: |
          cat > .env <<'EOF'
          APP_ENV=production
          APP_DEBUG=0
          SECRET_KEY=ci-secret-key-for-compose-config-check-123456
          ADMIN_INIT_USERNAME=ci-admin
          ADMIN_INIT_PASSWORD=ci-admin-password-123456
          MYSQL_ROOT_PASSWORD=ci-root-password-123456
          MYSQL_DATABASE=strategy_2560
          MYSQL_USER=strategy
          MYSQL_PASSWORD=ci-mysql-password-123456
          REDIS_PASSWORD=ci-redis-password-123456
          MARKET_DATA_PROVIDER=mootdx
          MARKET_DATA_FALLBACKS=akshare
          PICKS_REPOSITORY_BACKEND=mysql
          AUTH_REPOSITORY_BACKEND=mysql
          AUDIT_REPOSITORY_BACKEND=mysql
          SETTINGS_REPOSITORY_BACKEND=mysql
          LOGS_REPOSITORY_BACKEND=mysql
          STRATEGY_POOL_REPOSITORY_BACKEND=mysql
          STRATEGY_REPOSITORY_BACKEND=mysql
          TRADING_REPOSITORY_BACKEND=mysql
          WEB_WORKERS=2
          WEB_THREADS=4
          WEB_TIMEOUT=120
          WEB_GRACEFUL_TIMEOUT=30
          VITE_API_BASE=/api/v1
          EOF

      - name: Validate docker compose config
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t 2560-strategy-backend:ci .

      - name: Build frontend image
        run: docker build -t 2560-strategy-frontend:ci ./frontend

  production-mysql-smoke:
    name: Production MySQL smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production smoke environment
        run: |
          mkdir -p data backups
          cat > .env <<'EOF'
          APP_ENV=production
          APP_DEBUG=0
          SECRET_KEY=ci-secret-key-for-production-mysql-smoke-123456
          ADMIN_INIT_USERNAME=ci-admin
          ADMIN_INIT_PASSWORD=ci-admin-password-123456
          MYSQL_ROOT_PASSWORD=ci-root-password-123456
          MYSQL_DATABASE=strategy_2560
          MYSQL_USER=strategy
          MYSQL_PASSWORD=ci-mysql-password-123456
          REDIS_PASSWORD=ci-redis-password-123456
          MARKET_DATA_PROVIDER=mootdx
          MARKET_DATA_FALLBACKS=akshare
          PICKS_REPOSITORY_BACKEND=mysql
          AUTH_REPOSITORY_BACKEND=mysql
          AUDIT_REPOSITORY_BACKEND=mysql
          SETTINGS_REPOSITORY_BACKEND=mysql
          LOGS_REPOSITORY_BACKEND=mysql
          STRATEGY_POOL_REPOSITORY_BACKEND=mysql
          STRATEGY_REPOSITORY_BACKEND=mysql
          TRADING_REPOSITORY_BACKEND=mysql
          WEB_WORKERS=2
          WEB_THREADS=4
          WEB_TIMEOUT=120
          WEB_GRACEFUL_TIMEOUT=30
          VITE_API_BASE=/api/v1
          EOF

      - name: Start database dependencies
        run: docker compose up -d mysql redis

      - name: Run production preflight
        run: python scripts/deploy_preflight.py

      - name: Apply Alembic migrations
        run: docker compose run --rm backend python -m alembic upgrade head

      - name: Seed MySQL baseline
        run: docker compose run --rm backend python scripts/bootstrap_mysql_seed.py

      - name: Validate MySQL schema
        run: docker compose run --rm backend python scripts/validate_mysql_schema.py

      - name: Verify MySQL dump restore
        run: |
          mkdir -p backups
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -uroot --single-transaction --routines --triggers "$MYSQL_DATABASE"' > backups/ci_mysql_dump.sql
          sha256sum backups/ci_mysql_dump.sql
          test -s backups/ci_mysql_dump.sql
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -e "DROP DATABASE IF EXISTS restore_check_ci; CREATE DATABASE restore_check_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"'
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot restore_check_ci' < backups/ci_mysql_dump.sql
          docker compose run --rm -e DATABASE_URL=mysql+pymysql://${MYSQL_USER:-strategy}:${MYSQL_PASSWORD}@mysql:3306/restore_check_ci?charset=utf8mb4 backend python scripts/validate_mysql_schema.py

      - name: Validate production evidence passing fixture
        run: python -m pytest tests/test_production_evidence.py::test_production_evidence_accepts_complete_backup_soak_and_rollback_bundle

      - name: Start production stack
        run: docker compose up -d backend worker frontend

      - name: Assert production readiness over gateway
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5174/api/v1/readiness; then
              break
            fi
            if [ "$i" = "30" ]; then
              docker compose ps
              docker compose logs backend
              exit 1
            fi
            sleep 2
          done
          worker_status="$(docker compose ps --status running --services worker)"
          test "$worker_status" = "worker"
          legacy_status="$(curl -sS -o /tmp/legacy-api-response.txt -w '%{http_code}' -X POST http://localhost:5174/api/picks -H 'Content-Type: application/json' -d '{}')"
          test "$legacy_status" = "410"

      - name: Assert worker consumes a queued task
        run: |
          docker compose exec -T backend python - <<'PY'
          import time
          from backend.infrastructure.tasks.handlers import get_task_handler
          from backend.infrastructure.tasks.queue import enqueue_task, get_task

          task = enqueue_task(
              "reports.daily_review",
              get_task_handler("reports.daily_review"),
              tenant_id=1,
              payload={"trade_date": "2026-05-12", "source": "ci-worker-smoke"},
              idempotency_key=f"ci-worker-smoke-{int(time.time())}",
          )
          for _ in range(30):
              current = get_task(task["id"]) or {}
              if current.get("status") in {"completed", "failed", "cancelled", "stale"}:
                  print(current)
                  raise SystemExit(0 if current.get("status") == "completed" else 1)
              time.sleep(2)
          raise SystemExit("worker did not complete queued smoke task")
          PY

      - name: Stop compose services
        if: always()
        run: docker compose down -v
