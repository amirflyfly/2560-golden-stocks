{% extends 'base.html' %}

{% block title %}备份密钥管理 - 2560战法复盘系统{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">备份密钥管理</h1>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">HMAC签名密钥</h3>
    </div>
    <div class="card-body">
        <p style="color: var(--text-secondary); margin-bottom: 16px;">
            HMAC密钥用于验证备份文件的完整性和真实性。请妥善保管密钥文件。
        </p>
        
        <div class="alert alert-info" style="background: var(--primary-light); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
            <strong>当前状态：</strong>{{ '已配置' if has_key else '未配置' }}
        </div>
        
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <a href="{{ url_for('admin.download_key') }}" class="btn btn-primary" {% if not has_key %}disabled{% endif %}>下载密钥</a>
            <form method="POST" action="{{ url_for('admin.rotate_key') }}" style="display: inline;">
                <button type="submit" class="btn btn-secondary">轮换密钥</button>
            </form>
            <a href="{{ url_for('admin.import_key_page') }}" class="btn btn-secondary">导入密钥</a>
        </div>
    </div>
</div>
{% endblock %}
