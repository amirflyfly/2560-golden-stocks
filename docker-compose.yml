services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-strategy_2560}
      MYSQL_USER: ${MYSQL_USER:-strategy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-strategy}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-strategy_2560}?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/bootstrap_mysql_seed.py
    env_file:
      - .env
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:?set ADMIN_INIT_USERNAME in .env}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:?set ADMIN_INIT_PASSWORD in .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-strategy}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-strategy_2560}?charset=utf8mb4
    depends_on:
      migration:
        condition: service_completed_successfully

  schema-gate:
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/validate_mysql_schema.py
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-strategy}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-strategy_2560}?charset=utf8mb4
    depends_on:
      seed:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c 'if [ ! -s /root/.mootdx/config.json ]; then python -m mootdx bestip || true; fi;
      gunicorn --bind 0.0.0.0:8765 --workers $${WEB_WORKERS:-2} --threads $${WEB_THREADS:-4}
      --timeout $${WEB_TIMEOUT:-120} --graceful-timeout $${WEB_GRACEFUL_TIMEOUT:-30}
      --access-logfile - --error-logfile - --capture-output app:app'
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:?set ADMIN_INIT_USERNAME in .env}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:?set ADMIN_INIT_PASSWORD in .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-strategy}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-strategy_2560}?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      TASK_QUEUE_BACKEND: ${TASK_QUEUE_BACKEND:-redis}
      TASK_EXECUTION_MODE: ${TASK_EXECUTION_MODE:-worker}
      LIVE_BROKER_LAUNCH_POLICY: ${LIVE_BROKER_LAUNCH_POLICY:-disabled}
      ALERT_EVALUATION_INTERVAL_SECONDS: ${ALERT_EVALUATION_INTERVAL_SECONDS:-300}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mootdx}
      MARKET_DATA_FALLBACKS: ${MARKET_DATA_FALLBACKS:-akshare}
      PICKS_REPOSITORY_BACKEND: ${PICKS_REPOSITORY_BACKEND:-mysql}
      AUTH_REPOSITORY_BACKEND: ${AUTH_REPOSITORY_BACKEND:-mysql}
      AUDIT_REPOSITORY_BACKEND: ${AUDIT_REPOSITORY_BACKEND:-mysql}
      SETTINGS_REPOSITORY_BACKEND: ${SETTINGS_REPOSITORY_BACKEND:-mysql}
      LOGS_REPOSITORY_BACKEND: ${LOGS_REPOSITORY_BACKEND:-mysql}
      STRATEGY_POOL_REPOSITORY_BACKEND: ${STRATEGY_POOL_REPOSITORY_BACKEND:-mysql}
      STRATEGY_REPOSITORY_BACKEND: ${STRATEGY_REPOSITORY_BACKEND:-mysql}
      TRADING_REPOSITORY_BACKEND: ${TRADING_REPOSITORY_BACKEND:-mysql}
      PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-1}
      PAPER_INITIAL_CASH: ${PAPER_INITIAL_CASH:-1000000}
      PAPER_CASH_PER_TRADE: ${PAPER_CASH_PER_TRADE:-50000}
      PAPER_MAX_POSITIONS: ${PAPER_MAX_POSITIONS:-10}
      PAPER_STOP_LOSS_PCT: ${PAPER_STOP_LOSS_PCT:--0.08}
      PAPER_TAKE_PROFIT_PCT: ${PAPER_TAKE_PROFIT_PCT:-0.15}
      PAPER_MAX_HOLDING_DAYS: ${PAPER_MAX_HOLDING_DAYS:-20}
      PAPER_LOT_SIZE: ${PAPER_LOT_SIZE:-100}
      PAPER_FEE_RATE: ${PAPER_FEE_RATE:-0}
      PAPER_POSITION_SNAPSHOT_STALE_SECONDS: ${PAPER_POSITION_SNAPSHOT_STALE_SECONDS:-30}
      STRATEGY_SNAPSHOT_MAX_AGE_SECONDS: ${STRATEGY_SNAPSHOT_MAX_AGE_SECONDS:-120}
      STRATEGY_DAILY_BAR_MAX_LAG_DAYS: ${STRATEGY_DAILY_BAR_MAX_LAG_DAYS:-4}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
      WEB_TIMEOUT: ${WEB_TIMEOUT:-120}
      WEB_GRACEFUL_TIMEOUT: ${WEB_GRACEFUL_TIMEOUT:-30}
    expose:
      - "8765"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-gate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/readiness', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ./data:/app/data
      - mootdx_config:/root/.mootdx

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c 'if [ ! -s /root/.mootdx/config.json ]; then python -m mootdx bestip || true; fi;
      python -m backend.infrastructure.tasks.worker
      --alert-interval-seconds ${ALERT_EVALUATION_INTERVAL_SECONDS:-300}
      --market-sync-interval-seconds ${MARKET_SYNC_INTERVAL_SECONDS:-1800}
      --market-snapshot-interval-seconds ${MARKET_SNAPSHOT_INTERVAL_SECONDS:-60}
      --paper-position-snapshot-interval-seconds ${PAPER_POSITION_SNAPSHOT_INTERVAL_SECONDS:-0}
      --paper-position-monitor-interval-seconds ${PAPER_POSITION_MONITOR_INTERVAL_SECONDS:-5}
      --strategy-run-interval-seconds ${STRATEGY_RUN_INTERVAL_SECONDS:-300}
      --strategy-scan-daily-times ${STRATEGY_SCAN_DAILY_TIMES:-14:45}
      --strategy-scan-daily-strategies ${STRATEGY_SCAN_DAILY_STRATEGIES:-LIMIT_UP_RETURN,2560}
      --indicator-precompute-interval-seconds ${INDICATOR_PRECOMPUTE_INTERVAL_SECONDS:-3600}
      --qfq-repair-interval-seconds ${QFQ_REPAIR_INTERVAL_SECONDS:-86400}
      --daily-review-interval-seconds ${DAILY_REVIEW_INTERVAL_SECONDS:-86400}'
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-strategy}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-strategy_2560}?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      TASK_QUEUE_BACKEND: ${TASK_QUEUE_BACKEND:-redis}
      TASK_EXECUTION_MODE: ${TASK_EXECUTION_MODE:-worker}
      LIVE_BROKER_LAUNCH_POLICY: ${LIVE_BROKER_LAUNCH_POLICY:-disabled}
      ALERT_EVALUATION_INTERVAL_SECONDS: ${ALERT_EVALUATION_INTERVAL_SECONDS:-300}
      MARKET_SYNC_INTERVAL_SECONDS: ${MARKET_SYNC_INTERVAL_SECONDS:-1800}
      MARKET_SYNC_SYMBOLS: ${MARKET_SYNC_SYMBOLS:-all}
      MARKET_SYNC_INCREMENTAL: ${MARKET_SYNC_INCREMENTAL:-1}
      MARKET_BOOTSTRAP_ON_START: ${MARKET_BOOTSTRAP_ON_START:-1}
      MARKET_BOOTSTRAP_DAYS: ${MARKET_BOOTSTRAP_DAYS:-180}
      MARKET_SYNC_CORRECTION_DAYS: ${MARKET_SYNC_CORRECTION_DAYS:-3}
      MARKET_SYNC_ADJUST: ${MARKET_SYNC_ADJUST:-qfq}
      MARKET_SYNC_MAX_SYMBOLS: ${MARKET_SYNC_MAX_SYMBOLS:-0}
      MARKET_SYNC_BATCH_SIZE: ${MARKET_SYNC_BATCH_SIZE:-200}
      MARKET_SNAPSHOT_INTERVAL_SECONDS: ${MARKET_SNAPSHOT_INTERVAL_SECONDS:-60}
      MARKET_SNAPSHOT_SYMBOLS: ${MARKET_SNAPSHOT_SYMBOLS:-all}
      MARKET_SNAPSHOT_MAX_SYMBOLS: ${MARKET_SNAPSHOT_MAX_SYMBOLS:-0}
      MARKET_SNAPSHOT_BATCH_SIZE: ${MARKET_SNAPSHOT_BATCH_SIZE:-500}
      PAPER_POSITION_SNAPSHOT_INTERVAL_SECONDS: ${PAPER_POSITION_SNAPSHOT_INTERVAL_SECONDS:-0}
      PAPER_POSITION_SNAPSHOT_ACCOUNT_ID: ${PAPER_POSITION_SNAPSHOT_ACCOUNT_ID:-}
      PAPER_POSITION_SNAPSHOT_MAX_SYMBOLS: ${PAPER_POSITION_SNAPSHOT_MAX_SYMBOLS:-200}
      PAPER_POSITION_SNAPSHOT_BATCH_SIZE: ${PAPER_POSITION_SNAPSHOT_BATCH_SIZE:-0}
      PAPER_POSITION_SNAPSHOT_SECURITY_TYPE: ${PAPER_POSITION_SNAPSHOT_SECURITY_TYPE:-}
      PAPER_POSITION_MONITOR_INTERVAL_SECONDS: ${PAPER_POSITION_MONITOR_INTERVAL_SECONDS:-5}
      PAPER_POSITION_MONITOR_ACCOUNT_ID: ${PAPER_POSITION_MONITOR_ACCOUNT_ID:-}
      PAPER_POSITION_MONITOR_MAX_SYMBOLS: ${PAPER_POSITION_MONITOR_MAX_SYMBOLS:-200}
      PAPER_POSITION_MONITOR_BATCH_SIZE: ${PAPER_POSITION_MONITOR_BATCH_SIZE:-100}
      PAPER_POSITION_MONITOR_SECURITY_TYPE: ${PAPER_POSITION_MONITOR_SECURITY_TYPE:-}
      PAPER_POSITION_MONITOR_SYNC_SNAPSHOTS: ${PAPER_POSITION_MONITOR_SYNC_SNAPSHOTS:-1}
      PAPER_POSITION_MONITOR_EVALUATE_EXITS: ${PAPER_POSITION_MONITOR_EVALUATE_EXITS:-1}
      PAPER_POSITION_SNAPSHOT_STALE_SECONDS: ${PAPER_POSITION_SNAPSHOT_STALE_SECONDS:-30}
      STRATEGY_RUN_INTERVAL_SECONDS: ${STRATEGY_RUN_INTERVAL_SECONDS:-300}
      STRATEGY_RUN_DAILY_TIMES: ${STRATEGY_RUN_DAILY_TIMES:-}
      STRATEGY_RUN_DAILY_STRATEGIES: ${STRATEGY_RUN_DAILY_STRATEGIES:-}
      STRATEGY_RUN_DAILY_GRACE_SECONDS: ${STRATEGY_RUN_DAILY_GRACE_SECONDS:-900}
      STRATEGY_SCAN_DAILY_TIMES: ${STRATEGY_SCAN_DAILY_TIMES:-14:45}
      STRATEGY_SCAN_DAILY_STRATEGIES: ${STRATEGY_SCAN_DAILY_STRATEGIES:-LIMIT_UP_RETURN,2560}
      STRATEGY_SCAN_DAILY_GRACE_SECONDS: ${STRATEGY_SCAN_DAILY_GRACE_SECONDS:-900}
      STRATEGY_SCAN_DAILY_SCAN_LIMIT: ${STRATEGY_SCAN_DAILY_SCAN_LIMIT:-6000}
      STRATEGY_RUN_SCAN_LIMIT: ${STRATEGY_RUN_SCAN_LIMIT:-6000}
      STRATEGY_RUN_MIN_COVERAGE_RATIO: ${STRATEGY_RUN_MIN_COVERAGE_RATIO:-0}
      STRATEGY_SNAPSHOT_MAX_AGE_SECONDS: ${STRATEGY_SNAPSHOT_MAX_AGE_SECONDS:-120}
      STRATEGY_DAILY_BAR_MAX_LAG_DAYS: ${STRATEGY_DAILY_BAR_MAX_LAG_DAYS:-4}
      INDICATOR_PRECOMPUTE_INTERVAL_SECONDS: ${INDICATOR_PRECOMPUTE_INTERVAL_SECONDS:-3600}
      INDICATOR_PRECOMPUTE_SYMBOLS: ${INDICATOR_PRECOMPUTE_SYMBOLS:-all}
      INDICATOR_PRECOMPUTE_MAX_SYMBOLS: ${INDICATOR_PRECOMPUTE_MAX_SYMBOLS:-0}
      INDICATOR_PRECOMPUTE_LOOKBACK_DAYS: ${INDICATOR_PRECOMPUTE_LOOKBACK_DAYS:-180}
      INDICATOR_PRECOMPUTE_ADJUST: ${INDICATOR_PRECOMPUTE_ADJUST:-qfq}
      QFQ_REPAIR_INTERVAL_SECONDS: ${QFQ_REPAIR_INTERVAL_SECONDS:-86400}
      QFQ_REPAIR_SYMBOLS: ${QFQ_REPAIR_SYMBOLS:-all}
      QFQ_REPAIR_MAX_SYMBOLS: ${QFQ_REPAIR_MAX_SYMBOLS:-0}
      QFQ_REPAIR_CORRECTION_DAYS: ${QFQ_REPAIR_CORRECTION_DAYS:-30}
      DAILY_REVIEW_INTERVAL_SECONDS: ${DAILY_REVIEW_INTERVAL_SECONDS:-86400}
      DAILY_REVIEW_EVALUATE_EXITS: ${DAILY_REVIEW_EVALUATE_EXITS:-1}
      DAILY_REVIEW_PUSH: ${DAILY_REVIEW_PUSH:-0}
      DAILY_REVIEW_CHANNELS: ${DAILY_REVIEW_CHANNELS:-}
      DAILY_REVIEW_ACCOUNT_ID: ${DAILY_REVIEW_ACCOUNT_ID:-}
      DAILY_REVIEW_USER_ID: ${DAILY_REVIEW_USER_ID:-}
      WORKER_TENANT_ID: ${WORKER_TENANT_ID:-1}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mootdx}
      MARKET_DATA_FALLBACKS: ${MARKET_DATA_FALLBACKS:-akshare}
      PICKS_REPOSITORY_BACKEND: ${PICKS_REPOSITORY_BACKEND:-mysql}
      AUTH_REPOSITORY_BACKEND: ${AUTH_REPOSITORY_BACKEND:-mysql}
      AUDIT_REPOSITORY_BACKEND: ${AUDIT_REPOSITORY_BACKEND:-mysql}
      SETTINGS_REPOSITORY_BACKEND: ${SETTINGS_REPOSITORY_BACKEND:-mysql}
      LOGS_REPOSITORY_BACKEND: ${LOGS_REPOSITORY_BACKEND:-mysql}
      STRATEGY_POOL_REPOSITORY_BACKEND: ${STRATEGY_POOL_REPOSITORY_BACKEND:-mysql}
      STRATEGY_REPOSITORY_BACKEND: ${STRATEGY_REPOSITORY_BACKEND:-mysql}
      TRADING_REPOSITORY_BACKEND: ${TRADING_REPOSITORY_BACKEND:-mysql}
      PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-1}
      PAPER_INITIAL_CASH: ${PAPER_INITIAL_CASH:-1000000}
      PAPER_CASH_PER_TRADE: ${PAPER_CASH_PER_TRADE:-50000}
      PAPER_MAX_POSITIONS: ${PAPER_MAX_POSITIONS:-10}
      PAPER_STOP_LOSS_PCT: ${PAPER_STOP_LOSS_PCT:--0.08}
      PAPER_TAKE_PROFIT_PCT: ${PAPER_TAKE_PROFIT_PCT:-0.15}
      PAPER_MAX_HOLDING_DAYS: ${PAPER_MAX_HOLDING_DAYS:-20}
      PAPER_LOT_SIZE: ${PAPER_LOT_SIZE:-100}
      PAPER_FEE_RATE: ${PAPER_FEE_RATE:-0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-gate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; from redis import Redis; from sqlalchemy import create_engine, text; Redis.from_url(os.environ['REDIS_URL']).ping(); engine = create_engine(os.environ['DATABASE_URL'], pool_pre_ping=True); conn = engine.connect(); conn.execute(text('SELECT 1')); conn.close()\""]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    volumes:
      - ./data:/app/data
      - mootdx_config:/root/.mootdx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${FRONTEND_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:24-alpine}
        NGINX_BASE_IMAGE: ${NGINX_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nginx:1.27-alpine}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  mootdx_config:
