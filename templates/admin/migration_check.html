{% extends 'base.html' %}

{% block title %}数据库迁移检查 - 2560战法复盘系统{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">数据库迁移检查</h1>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">picks表字段</h3>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>字段名</th>
                        <th>类型</th>
                        <th>是否可空</th>
                        <th>默认值</th>
                    </tr>
                </thead>
                <tbody>
                    {% for col in picks_cols %}
                    <tr>
                        <td class="font-medium">{{ col.name }}</td>
                        <td>{{ col.type }}</td>
                        <td>{{ '是' if col.notnull == 0 else '否' }}</td>
                        <td>{{ col.dflt_value | default('-') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
